<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style id="css">
:root{
  /* Layout: a block-game inventory screen. Reminders first, then money tiles, XP bar for the goal, inventory, advancements, log. */
  --stone:#17171c;
  --panel:#24242c;
  --slot:#33333d;
  --edge-hi:#45454f;
  --edge-lo:#0b0b0e;
  --text:#ececf2;
  --muted:#a2a2b4;
  --diamond:#4aedd9;
  --xp:#80d42a;
  --gold:#f5c542;
  --red:#ff5c5c;
  --display:"Press Start 2P", ui-monospace, monospace;
  --body:"VT323", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background-color:var(--stone);
  background-image:
    linear-gradient(45deg, rgba(255,255,255,.018) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.018) 75%),
    linear-gradient(45deg, rgba(255,255,255,.018) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.018) 75%);
  background-size:24px 24px;background-position:0 0,12px 12px;
  color:var(--text);font-family:var(--body);font-size:22px;line-height:1.25;
}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:22px;color:var(--diamond);text-shadow:3px 3px 0 #0d4a44;letter-spacing:1px}
h2{font-size:12px;color:var(--text);text-shadow:2px 2px 0 #000;margin-bottom:12px}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:3px solid #000;box-shadow:inset 3px 3px 0 var(--edge-hi),inset -3px -3px 0 var(--edge-lo);padding:16px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center}
.brand svg{width:44px;height:40px}
.sub{color:var(--muted);margin-top:6px}
.chip{font-family:var(--body);font-size:18px;padding:2px 10px;border:2px solid #000;background:var(--slot);color:var(--muted);white-space:nowrap}
.chip.ok,.chip.good{color:var(--xp)} .chip.warn{color:var(--gold)}
.chip.bad{color:#fff;background:#a83232}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.panelhead h2{margin:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile .label{font-family:var(--display);font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
.tile .big{font-family:var(--display);font-size:26px;margin:14px 0 8px;font-variant-numeric:tabular-nums}
.vault .big{color:var(--diamond);text-shadow:3px 3px 0 #0d4a44}
.wallet .big{color:var(--gold);text-shadow:3px 3px 0 #5a4410}
.streak .big{color:var(--xp);text-shadow:3px 3px 0 #2a4a0c}
.lock{font-family:var(--display);font-size:8px;color:#000;background:var(--diamond);padding:4px 6px}
.meter{height:14px;background:#000;border:2px solid #000;position:relative}
.meter i{display:block;height:100%;background:var(--gold);box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.xpwrap{position:relative;margin:18px 0 10px}
.xp{height:22px;background:#111;border:3px solid #000;position:relative;overflow:hidden}
.xp i{display:block;height:100%;background:var(--xp);box-shadow:inset 0 4px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.25)}
.xp::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 3px),#000 calc(10% - 3px) 10%)}
.lvl{position:absolute;left:50%;top:-16px;transform:translateX(-50%);font-family:var(--display);font-size:14px;color:var(--xp);text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;z-index:2}
.goalhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.goalname{font-family:var(--display);font-size:13px;color:var(--gold)}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted)}
.facts b{color:var(--text);font-weight:400}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{
  font-family:var(--display);font-size:10px;color:#fff;text-shadow:2px 2px 0 #3a3a3a;
  background:#717179;border:3px solid #000;padding:12px 14px;cursor:pointer;
  box-shadow:inset 3px 3px 0 #a5a5ad,inset -3px -3px 0 #45454c;
}
.btn.sm{font-size:8px;padding:9px 10px}
.btn:hover:not(:disabled){background:#7d8fb8;box-shadow:inset 3px 3px 0 #b3c3e6,inset -3px -3px 0 #4f5f86}
.btn:focus-visible{outline:3px solid var(--diamond);outline-offset:2px}
.btn:disabled{color:#a0a0a0;text-shadow:none;background:#3e3e44;box-shadow:inset 3px 3px 0 #55555c,inset -3px -3px 0 #2a2a2f;cursor:not-allowed}
.btn.primary{background:#2a9d8f;box-shadow:inset 3px 3px 0 #6fe3d3,inset -3px -3px 0 #16584f}
.btn.primary:hover:not(:disabled){background:#33b5a5}
.btn.danger{background:#a83232;box-shadow:inset 3px 3px 0 #e07070,inset -3px -3px 0 #5e1717}
.btn.danger:hover:not(:disabled){background:#c03b3b}
.btn.loud{font-size:12px;padding:16px 18px}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start}
.inv{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.slot{aspect-ratio:1;background:var(--slot);box-shadow:inset 3px 3px 0 #1a1a20,inset -3px -3px 0 #4a4a55;position:relative;display:grid;place-items:center}
.slot svg{width:62%;height:62%}
.slot span{position:absolute;right:4px;bottom:0;font-size:20px;color:#fff;text-shadow:2px 2px 0 #3a3a3a;font-variant-numeric:tabular-nums}
.invnote{margin-top:10px;color:var(--muted)}
.adv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.a{background:var(--slot);border:3px solid #000;padding:8px;display:grid;gap:4px;align-content:start}
.a .n{font-family:var(--display);font-size:8px;line-height:1.5}
.a .d{font-size:17px;color:var(--muted);line-height:1.05}
.a.on{border-color:var(--gold);box-shadow:inset 0 0 0 2px #000}
.a.on .n{color:var(--gold)}
.a.off{opacity:.55}
.log{list-style:none;margin:0;padding:0;display:grid}
.log li{display:grid;grid-template-columns:62px 1fr auto;gap:10px;padding:6px 0;border-bottom:2px solid #1a1a20;align-items:baseline}
.log .when{color:var(--muted);font-size:18px}
.log .amt{font-variant-numeric:tabular-nums}
.k-pay .amt,.k-bonus .amt,.k-sweep .amt{color:var(--diamond)}
.k-spend .amt{color:var(--gold)}
.k-break .amt{color:var(--red)}
.empty{color:var(--muted);padding:6px 0}
/* reminders */
.rems{display:grid;gap:8px}
.rem{display:grid;grid-template-columns:100px 1fr auto auto;grid-template-areas:"t n c a";gap:12px;align-items:center;padding:10px 12px;background:var(--slot);border:3px solid #000}
.rem .rt{grid-area:t;font-family:var(--display);font-size:11px;color:var(--diamond)}
.rem .rn{grid-area:n;min-width:0}
.rem .rn b{font-weight:400;font-size:26px;display:block;line-height:1}
.rem .rn .muted{font-size:18px}
.rem .chip{grid-area:c}
.rem .ra{grid-area:a;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rem.s-due{border-color:var(--red);animation:pulse 1s steps(2) infinite}
.rem.s-done,.rem.s-off{opacity:.7}
@keyframes pulse{50%{border-color:#000}}
.soundbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{color:var(--muted);font-size:19px;margin:12px 0 0;max-width:70ch}
.setup{border:3px solid #000;background:#3b3212;color:#ffe28a;padding:8px 12px;margin-bottom:10px}
.days{display:flex;gap:6px;flex-wrap:wrap;border:0;padding:0;margin:0}
.days legend{color:var(--muted);font-size:19px;padding:0;margin-bottom:4px}
.days label{display:flex;gap:6px;align-items:center;background:var(--slot);border:2px solid #000;padding:2px 8px;color:var(--text)}
.check{display:flex;gap:8px;align-items:center;color:var(--text)}
details.settings summary{font-family:var(--display);font-size:11px;cursor:pointer;list-style:none}
details.settings summary::-webkit-details-marker{display:none}
details.settings summary::before{content:"> ";color:var(--diamond)}
details.settings[open] summary::before{content:"v ";}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.form h3{grid-column:1/-1;font-size:9px;color:var(--muted);margin-top:6px}
label{display:grid;gap:4px;font-size:19px;color:var(--muted)}
input,select{font-family:var(--body);font-size:22px;color:var(--text);background:#0e0e12;border:3px solid #000;box-shadow:inset 2px 2px 0 #000,inset -2px -2px 0 #3a3a44;padding:6px 8px;width:100%}
input[type=checkbox]{width:20px;height:20px;padding:0;box-shadow:none;accent-color:var(--diamond)}
input[type=range]{padding:0;box-shadow:none;border:0;background:transparent;accent-color:var(--xp)}
input:focus-visible,select:focus-visible{outline:3px solid var(--diamond);outline-offset:0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row.end{justify-content:flex-end}
.row .grow{margin-right:auto}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px;z-index:50;overflow-y:auto}
.overlay.alarm{z-index:90;background:rgba(40,0,0,.78)}
.dialog{width:min(480px,100%);display:grid;gap:12px}
.dialog h2{margin:0;font-size:12px;line-height:1.6}
.dialog p{margin:0}
.alarmbox{border-color:var(--red);animation:pulse 1s steps(2) infinite,pop .3s cubic-bezier(.2,.9,.3,1.3);width:min(520px,100%)}
.overlay.alarm{background:repeating-linear-gradient(45deg,rgba(70,6,10,.9) 0 26px,rgba(40,0,4,.9) 26px 52px);background-size:74px 74px;animation:fade .2s ease-out,stripes 1.6s linear infinite}
@keyframes stripes{to{background-position:74px 0}}
.al-top{display:flex;gap:14px;align-items:center}
.al-pip{width:100px;height:108px;flex:none}
.alrow{position:relative;overflow:hidden;transition:max-height .38s cubic-bezier(.4,0,.2,1),opacity .3s,transform .38s cubic-bezier(.4,0,.2,1),padding .38s,margin .38s,border-width .38s,border-color .15s,background-color .15s}
.alrow.got{border-color:var(--xp);background:#203a1a}
.alrow.got::after{content:"DONE!";position:absolute;right:14px;top:50%;font-family:var(--display);font-size:16px;color:var(--xp);text-shadow:3px 3px 0 #000;animation:stamp .25s cubic-bezier(.2,.9,.3,1.5) forwards;transform:translateY(-50%) rotate(-8deg)}
.alrow.got.skip{border-color:var(--muted);background:#2a2a30}.alrow.got.skip::after{content:"SKIPPED";color:var(--muted)}
.alrow.got.snz{border-color:var(--gold);background:#3a3212}.alrow.got.snz::after{content:"SNOOZED";color:var(--gold)}
@keyframes stamp{from{opacity:0;transform:translateY(-50%) rotate(-8deg) scale(2.2)}to{opacity:1;transform:translateY(-50%) rotate(-8deg) scale(1)}}
.alrow.leaving{opacity:0;transform:translateX(70px) scale(.96);max-height:0!important;padding-top:0;padding-bottom:0;margin-top:-12px;border-width:0}
.overlay.closing{animation:fadeout .32s ease-in forwards}
.success{position:fixed;inset:0;z-index:98;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,rgba(20,60,10,.55),rgba(0,0,0,.35) 70%);animation:fade .15s ease-out}
.success.out{animation:fadeout .45s ease-in forwards}
.stamp{font-family:var(--display);font-size:clamp(44px,11vw,150px);color:var(--xp);letter-spacing:4px;padding:.25em .45em;border:.09em solid var(--xp);outline:.04em solid var(--xp);outline-offset:.08em;
  text-shadow:.04em .04em 0 #1d3a08;box-shadow:inset 0 0 0 .03em rgba(0,0,0,.25);background:rgba(10,30,5,.55);transform:rotate(-9deg);animation:slam .5s cubic-bezier(.2,.9,.3,1.25) both}
.stamp small{display:block;font-size:.18em;letter-spacing:2px;text-align:center;margin-top:.5em;color:#d9ffb8;text-shadow:2px 2px 0 #000}
@keyframes slam{0%{opacity:0;transform:rotate(-20deg) scale(3.2)}55%{opacity:1;transform:rotate(-7deg) scale(.92)}75%{transform:rotate(-10deg) scale(1.04)}100%{transform:rotate(-9deg) scale(1)}}
.shake{animation:shake .45s steps(6)}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,3px)}}
.overlay.closing .dialog{animation:shrink .32s ease-in forwards}
@keyframes fadeout{to{opacity:0}}
@keyframes shrink{to{opacity:0;transform:scale(.9) translateY(10px)}}
.rem.got{border-color:var(--xp);background:#203a1a;transition:background-color .15s,border-color .15s}
.al-sub{color:var(--muted);font-size:20px}
.alrow{animation:rise .3s ease-out both}
.alarmbox.settled .alrow{animation:none}
.alrow:nth-child(3){animation-delay:.06s}.alrow:nth-child(4){animation-delay:.12s}.alrow:nth-child(5){animation-delay:.18s}
.al-time{font-family:var(--display);font-size:9px;color:var(--diamond)}
.al-all{display:flex;justify-content:center}
.al-done{text-align:center;justify-items:center}
.al-done h2{color:var(--xp);font-size:16px}
body.alarm-only{background:#1a0004}
.alarmbox h2{font-size:15px;color:var(--red);line-height:1.5}
.alrow{display:grid;gap:8px;padding:10px;background:var(--slot);border:3px solid #000}
.alrow b{font-weight:400;font-size:30px;color:var(--gold);line-height:1}
.err{color:var(--red);min-height:1.2em}
.warnbox{border:3px solid #000;background:#3a1717;padding:10px;color:#ffb3b3}
.toasts{position:fixed;top:14px;right:14px;display:grid;gap:8px;z-index:60}
.toast{background:#1c1c22;border:3px solid #000;box-shadow:inset 3px 3px 0 #3a3a46,inset -3px -3px 0 #0a0a0c;padding:10px 14px;display:flex;gap:12px;align-items:center;min-width:250px;animation:slide .35s steps(5)}
.toast svg{width:32px;height:28px}
.toast .t1{font-family:var(--display);font-size:9px;color:var(--gold)}
.toast .t2{font-size:22px}
@keyframes slide{from{transform:translateX(120%)}to{transform:none}}
/* motion */
.btn{transition:transform .08s ease-out,background-color .15s,filter .15s}
.btn:active:not(:disabled){transform:translateY(2px);filter:brightness(.92)}
.overlay{animation:fade .18s ease-out}
.dialog{animation:pop .24s cubic-bezier(.2,.9,.3,1.25)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}}
.xp i,.meter i{transition:width .7s cubic-bezier(.2,.8,.2,1)}
.wrap.intro>*{animation:rise .45s ease-out both}
.wrap.intro>*:nth-child(2){animation-delay:.05s}.wrap.intro>*:nth-child(3){animation-delay:.1s}
.wrap.intro>*:nth-child(4){animation-delay:.15s}.wrap.intro>*:nth-child(5){animation-delay:.2s}
.wrap.intro>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.panel,.rem,.a,.slot{transition:border-color .2s,background-color .2s}
.a.on{animation:none}
/* welcome + tutorial */
.wl{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;overflow-y:auto;
  background:radial-gradient(ellipse at 50% 25%,#20303a 0%,#17171c 65%)}
#wl-cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.wl-card{z-index:1}
.wl-card{position:relative;width:min(660px,100%);display:grid;gap:18px}
.wl-title{text-align:center;justify-items:center}
.wl-gem svg{width:104px;height:92px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 0 rgba(0,0,0,.35))}
@keyframes bob{50%{transform:translateY(-12px)}}
.wl-logo{font-family:var(--display);font-size:clamp(26px,7vw,48px);color:var(--diamond);text-shadow:4px 4px 0 #0d4a44,8px 8px 0 #000;letter-spacing:2px;margin:0}
.wl-tag{color:var(--muted);font-size:24px;max-width:36ch}
.blink{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.linkbtn{background:none;border:0;color:var(--muted);font-family:var(--body);font-size:20px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--text)}
.linkbtn:focus-visible{outline:3px solid var(--diamond);outline-offset:2px}
.wl-in{animation:rise .5s ease-out both}
.wl-out{animation:wlout .35s ease-in forwards}
@keyframes wlout{to{opacity:0;transform:scale(1.03)}}
.tut .slide{display:grid;gap:14px;align-content:start;min-height:330px}
.tut h2{font-size:14px;color:var(--gold);margin:0;line-height:1.5}
.tut p{margin:0;max-width:60ch}
.tut .step{font-family:var(--display);font-size:9px;color:var(--muted)}
.sl-r{animation:slr .32s ease-out}.sl-l{animation:sll .32s ease-out}
@keyframes slr{from{opacity:0;transform:translateX(28px)}}
@keyframes sll{from{opacity:0;transform:translateX(-28px)}}
.pips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pip{width:24px;height:12px;background:#0e0e12;border:2px solid #000;padding:0;cursor:pointer}
.pip.on{background:var(--xp);box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.demo{background:#1b1b22;border:3px solid #000;padding:12px;display:grid;gap:10px}
.demo .tiles{grid-template-columns:1fr 1fr}
.demo .tile .big{font-size:20px;margin:8px 0 0}
.demo .xpwrap{margin:16px 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.gemrow{display:flex;gap:6px}.gemrow svg{width:30px;height:27px}
.tutnav{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tutnav .row{margin:0}
.keys{color:var(--muted);font-size:18px;text-align:center}
/* fun layer */
#fx-cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95}
.floater{position:fixed;z-index:96;pointer-events:none;font-family:var(--display);font-size:13px;color:var(--diamond);text-shadow:2px 2px 0 #000;transform:translate(-50%,-50%);animation:floatup 1.1s ease-out forwards;white-space:nowrap}
.floater.gold{color:var(--gold)}.floater.red{color:var(--red)}.floater.green{color:var(--xp)}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
.lvlup{position:fixed;inset:0;z-index:94;display:grid;place-items:center;background:rgba(0,0,0,.45);animation:fade .2s ease-out;cursor:pointer}
.lvlup-box{text-align:center;display:grid;gap:10px;animation:pop .4s cubic-bezier(.2,.9,.3,1.4)}
.lvlup-box .t{font-family:var(--display);font-size:clamp(26px,6vw,44px);color:var(--xp);text-shadow:4px 4px 0 #2a4a0c,8px 8px 0 #000}
.lvlup-box .n{font-family:var(--display);font-size:16px;color:var(--gold);text-shadow:2px 2px 0 #000}
.slot svg{transition:transform .15s}
.slot:hover svg{transform:translateY(-3px) scale(1.12)}
.slot svg.spin{animation:spin .6s steps(8)}
@keyframes spin{to{transform:rotateY(360deg)}}
.a.on:hover{box-shadow:inset 0 0 0 2px #000,0 0 0 3px rgba(245,197,66,.35)}
.buddy{position:fixed;right:18px;bottom:18px;z-index:60;display:grid;justify-items:end;gap:8px;pointer-events:none}
.buddy-btn{pointer-events:auto;background:none;border:0;padding:0;cursor:pointer;width:110px;height:120px;position:relative}
.buddy-btn:focus-visible{outline:3px solid var(--diamond);outline-offset:4px}
canvas.pip3d{display:block;width:100%;height:100%}
.buddy-btn canvas.pip3d{width:110px;height:120px}
.buddy-btn.hop canvas{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes idle{50%{transform:translateY(-3px)}}
@keyframes alertb{50%{transform:translateY(-8px)}}
@keyframes party{25%{transform:translateY(-10px) rotate(-6deg)}75%{transform:translateY(-10px) rotate(6deg)}}
@keyframes hop{40%{transform:translateY(-22px) scaleY(1.08)}80%{transform:translateY(2px) scaleY(.9)}}
.zzz{position:absolute;top:-6px;left:-4px;font-family:var(--display);font-size:10px;color:var(--muted);animation:zz 2s ease-in-out infinite}
@keyframes zz{50%{transform:translate(-4px,-6px);opacity:.5}}

(function(){

    {id:'r-fast',name:'Kirsty (fast-acting)',mode:'timer',anchor:Date.now(),time:hm(new Date().getHours()*60+new Date().getMinutes()),every:3,days:ALL.slice(),sound:'alarm',snooze:5,note:'Fast-acting insulin',on:true,since:0},

    if(s.profile&&typeof s.profile==='object')d.profile=Object.assign(d.profile,s.profile);

    if(s.fx&&typeof s.fx==='object')d.fx=Object.assign(d.fx,s.fx);
    if(s.parent&&typeof s.parent==='object'){var ev=Object.assign(d.parent.ev,s.parent.ev||{});d.parent=Object.assign(d.parent,s.parent);d.parent.ev=ev}
    if(s.snz&&typeof s.snz==='object')d.snz=s.snz;
  }
  if(!d.reminders){d.reminders=defaultReminders();d.mig3=true;d.mig4=true}

var embedded=null;try{embedded=JSON.parse(document.getElementById('state').textContent)}catch(e){}
var state=normalize(embedded);
var mode='pending',readOnly=false,statusMsg='',docRef=null,loaded=false;
function SZ(){if(!state.snz||typeof state.snz!=='object')state.snz={};return state.snz}
var DESKTOP=location.protocol==='http:'&&location.hostname==='127.0.0.1'&&location.port==='47821';
var ALARM_ONLY=DESKTOP&&location.hash==='#alarm';

/* ---------- helpers ---------- */
function round(n){return Math.round(n*100)/100}
function fmt(n){n=round(n);return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:(n%1)?2:0,maximumFractionDigits:2})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function weekKey(t){var d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d)}
function prevWeek(k){var p=k.split('-');return keyOf(new Date(+p[0],+p[1]-1,+p[2]-7))}
function shortDate(t){return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function longDate(t){return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function clock(t){return new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
function fmtTime(hm){var p=hm.split(':'),h=+p[0],m=p[1];return ((h%12)||12)+':'+m+' '+(h<12?'AM':'PM')}
function toMin(hm){var p=hm.split(':');return (+p[0])*60+(+p[1])}
function amt(v){var n=round(parseFloat(String(v).replace(/[$,\s]/g,'')));return isFinite(n)&&n>0?n:null}
function spendAmt(){return round(state.settings.allowance-state.settings.save)}
function streak(s){
  var paid={},broke={};
  s.log.forEach(function(e){var w=weekKey(e.t);if(e.k==='pay')paid[w]=1;if(e.k==='break')broke[w]=1});
  var w=weekKey(Date.now());
  if(broke[w])return 0;
  if(!paid[w])w=prevWeek(w);
  var n=0;while(paid[w]&&!broke[w]){n++;w=prevWeek(w)}
  return n;
}
var ICONS={

  drop:{p:{X:'#111',C:'#4ab3ff',W:'#d6f0ff'},m:['...XX...','...XX...','..XCCX..','.XCWCCX.','.XCWCCX.','XCCCCCCX','.XCCCCX.','..XXXX..']},
  paw:{p:{N:'#d79a5a'},m:['NN....NN','NN.NN.NN','...NN...','........','..NNNN..','.NNNNNN.','.NNNNNN.','..NNNN..']},

var TEMPLATES=[
  {k:'pill',name:'Medicine',time:'08:00',sound:'alarm',med:true},
  {k:'pen',name:'Insulin',time:'08:00',sound:'alarm',med:true},
  {k:'tooth',name:'Brush teeth',time:'07:30',sound:'chime'},

  var c=gray?{X:'#111',L:'#8a8a8a',W:'#bdbdbd',M:'#666',D:'#444'}:{X:'#0b3532',L:'#a8fdf0',W:'#ffffff',M:'#4aedd9',D:'#259a8c'};

/* ---------- reminder logic ---------- */
function findRem(id){for(var i=0;i<state.reminders.length;i++)if(state.reminders[i].id===id)return state.reminders[i];return null}
function hm(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function isTimer(r){return r.mode==='timer'&&r.anchor&&r.every>0}
function per(r){return r.every*3600000}
function scheduledOn(r,d){return r.on&&(isTimer(r)||r.days.indexOf(d.getDay())>=0)}
function ivOcc(r,k){var ts=r.anchor+k*per(r),d=new Date(ts);return {r:r,ts:ts,t:hm(d.getHours()*60+d.getMinutes()),key:keyOf(d)+'|'+r.id+'#'+ts}}
function ivLatestK(r,now){return Math.floor((now-r.anchor)/per(r))}
function slots(r){
  if(!r.every)return [r.time];
  var s=toMin(r.time),e=toMin(r.until||'23:59'),out=[];
  if(e<s)e=s;
  for(var m=s;m<=e;m+=Math.round(r.every*60))out.push(hm(m));
  return out;
}
function occKey(d,r,t){return keyOf(d)+'|'+r.id+(r.every?'@'+t:'')}
function occs(r,d){
  if(isTimer(r)){
    var a=new Date(d);a.setHours(0,0,0,0);var b=new Date(a);b.setDate(b.getDate()+1);
    var k0=Math.max(1,Math.ceil((a.getTime()-r.anchor)/per(r))),k1=Math.floor((b.getTime()-1-r.anchor)/per(r)),out=[];
    for(var k=k0;k<=k1;k++)out.push(ivOcc(r,k));
    return out;
  }
  return slots(r).map(function(t){return {r:r,t:t,key:occKey(d,r,t)}});
}
function idOfKey(k){return k.split('|')[1].split(/[@#]/)[0]}
function occStatus(o,now,doses){
  var rec=(doses||state.doses)[o.key];
  if(rec)return rec.s==='taken'?{k:'done',label:'Done '+clock(rec.t),rec:rec}:{k:'done',label:'Skipped',rec:rec};
  if(o.ts){
    var n=now.getTime();
    if(n<o.ts){var lm=Math.ceil((o.ts-n)/60000),lh=Math.floor(lm/60);return {k:'up',label:'in '+(lh?lh+'h ':'')+(lm%60)+'m'}}
    if(n>=o.ts+per(o.r))return {k:'late',label:'Missed'};
    if(SZ()[o.key]&&SZ()[o.key]>n)return {k:'snz',label:'Snoozed to '+clock(SZ()[o.key])};
    return {k:'due',label:'TIME!'};
  }
  var mins=now.getHours()*60+now.getMinutes(),at=toMin(o.t);
  if(mins<at){var left=at-mins,h=Math.floor(left/60),m=left%60;return {k:'up',label:'in '+(h?h+'h ':'')+m+'m'}}
  var sched=new Date(now);sched.setHours(Math.floor(at/60),at%60,0,0);
  if((o.r.since||0)>sched.getTime())return {k:'late',label:'Not done yet'};
  if(SZ()[o.key]&&SZ()[o.key]>now.getTime())return {k:'snz',label:'Snoozed to '+clock(SZ()[o.key])};
  return {k:'due',label:'TIME!'};
}
// one row per reminder: picks the occurrence that matters right now
function remView(r,now){
  if(!r.on)return {k:'off',label:'Paused'};
  if(!scheduledOn(r,now))return {k:'off',label:'Off today'};
  if(isTimer(r)){
    var kk=ivLatestK(r,now.getTime()),cur=kk>=1?ivOcc(r,kk):null,nxt=ivOcc(r,Math.max(1,kk+1));
    var cs=cur?occStatus(cur,now):null,pick=(cs&&(cs.k==='due'||cs.k==='snz'))?cur:nxt,ps=pick===cur?cs:occStatus(nxt,now);
    var today=occs(r,now),tk=today.filter(function(x){var q=state.doses[x.key];return q&&q.s==='taken'}).length;
    pick.st=ps;
    return {k:ps.k,label:ps.label,rec:ps.rec,occ:pick,total:today.length,taken:tk,undoKey:(cs&&cs.rec)?cur.key:null};
  }
  var list=occs(r,now).map(function(o){o.st=occStatus(o,now);return o});
  function first(k){for(var i=0;i<list.length;i++)if(list[i].st.k===k)return list[i];return null}
  function last(k){for(var i=list.length-1;i>=0;i--)if(list[i].st.k===k)return list[i];return null}
  var o=first('due')||first('snz')||first('up')||last('late')||last('done');
  var taken=list.filter(function(x){return x.st.rec&&x.st.rec.s==='taken'}).length;
  var lastDone=last('done');
  return {k:o.st.k,label:o.st.label,rec:o.st.rec,occ:o,total:list.length,taken:taken,undoKey:lastDone?lastDone.key:null};
}
function dueList(){
  var now=new Date(),out=[];
  state.reminders.forEach(function(r){
    if(!scheduledOn(r,now))return;
    if(isTimer(r)){var k=ivLatestK(r,now.getTime());if(k>=1){var o=ivOcc(r,k);if(occStatus(o,now).k==='due')out.push(o)}return}
    occs(r,now).forEach(function(o){if(occStatus(o,now).k==='due')out.push(o)});
  });
  return out;
}
function medStreak(s){
  var day=new Date();day.setHours(12,0,0,0);
  function dayDone(d){
    var sch=s.reminders.filter(function(r){return scheduledOn(r,d)});
    if(!sch.length)return null;
    return sch.every(function(r){return occs(r,d).every(function(o){var x=s.doses[o.key];return x&&x.s==='taken'})});
  }
  var n=0,first=true,stop=new Date(s.created||Date.now());stop.setHours(0,0,0,0);
  for(var i=0;i<400;i++){
    if(day<stop)break;
    var r=dayDone(day);
    if(r===true)n++;
    else if(r===false&&!first)break;
    first=false;day.setDate(day.getDate()-1);
  }
  return n;
}

/* ---------- sound ---------- */
var actx=null;
function unlock(){
  try{
    if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;actx=new AC()}
    if(actx.state!=='running')actx.resume().then(renderSound,function(){});

function tone(f,t,dur,type,vol){

  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+0.05);
}

  if(DESKTOP){fetch('/api/test?sound='+encodeURIComponent(kind)).catch(function(){});return true}

/* ---------- saving ---------- */
var flushTimer=null,writing=false,dirty=false,retries=0;
function scheduleFlush(){if(mode==='desktop'){clearTimeout(flushTimer);flushTimer=setTimeout(flushDesk,300);return}
  if(mode!=='db'||readOnly||!docRef)return;clearTimeout(flushTimer);flushTimer=setTimeout(flush,400)}
function flush(){
  if(writing){dirty=true;return}
  writing=true;dirty=false;renderStatus();
  docRef.set(clone(state)).then(function(){retries=0;if(/save/i.test(statusMsg))statusMsg=''},function(e){
    var c=e&&e.code;
    if(c==='invalid_argument'){readOnly=true;statusMsg=''}
    else if(c==='unavailable'&&retries<3){retries++;dirty=true}
    else statusMsg='Could not save online. Changes stay on this device.';
  }).then(function(){writing=false;renderStatus();if(dirty)setTimeout(flush,1500)});
}
var syncedAt=0;
function flushDesk(){
  if(writing){dirty=true;return}
  writing=true;dirty=false;
  var sent=state.updated;
  var body=Object.assign({},state,{_base:syncedAt});
  fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){if(!r.ok)throw 0;syncedAt=Math.max(syncedAt,sent||0);if(/desktop app/i.test(statusMsg))statusMsg=''})
    .catch(function(){statusMsg='Could not save to the desktop app. Is it still running?'})
    .then(function(){writing=false;renderStatus();if(dirty)flushDesk()});
}
var pageVer=null;
function checkVersion(){
  fetch('/api/version',{cache:'no-store'}).then(function(r){return r.json()}).then(function(v){
    if(pageVer===null)pageVer=v.page;
    else if(v.page!==pageVer&&!writing&&!document.querySelector('#modal-host form'))location.reload();
  }).catch(function(){});
}
function pollDesk(first){
  checkVersion();
  fetch('/api/state'+(ALARM_ONLY?'?src=alarm':''),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    if(statusMsg&&/desktop app/i.test(statusMsg)){statusMsg='';renderStatus()}
    if(!d||typeof d!=='object'||!d.v){if(first){state.updated=state.updated||Date.now();flushDesk();maybeWelcome()}return}
    if(d&&d.updated)syncedAt=Math.max(syncedAt,d.updated);
    if(!writing&&(d.updated||0)>(state.updated||0)){state=normalize(d);lastLevel=Math.floor(state.vault/100);render();tick();updateBuddy()}
    else if(first&&(state.updated||0)>(d.updated||0))flushDesk();
    if(first)maybeWelcome();
  }).catch(function(){statusMsg='Lost the desktop app. Reopen Pixel Life.exe.';renderStatus()});
}
function commit(){
  checkAdv();
  // keep the record small: last 500 money entries, last 90 days of doses
  if(state.log.length>500)state.log=state.log.slice(-500);
  var cut=new Date();cut.setDate(cut.getDate()-90);var ck=keyOf(cut);
  Object.keys(state.doses).forEach(function(k){if(k.split('|')[0]<ck)delete state.doses[k]});
  var nowms=Date.now();Object.keys(SZ()).forEach(function(k){if(SZ()[k]<nowms)delete SZ()[k]});
  state.updated=Date.now();
  lsSet(LS,JSON.stringify(state));
  var lvlNow=Math.floor(state.vault/100);
  if(lastLevel!==null&&lvlNow>lastLevel)setTimeout(function(){levelUp(lvlNow)},350);
  lastLevel=lvlNow;
  checkAllDone();
  render();scheduleFlush();showToasts();tick();updateBuddy();
}

/* ---------- alarm loop ---------- */
var lastRing=0,alarmKey='';
function tick(){
  var due=dueList();
  if(due.length){
    var key=due.map(function(o){return o.key}).join(',')+'|'+soundOn();
    if(key!==alarmKey){alarmKey=key;renderAlarm(due)}
    var now=Date.now();
    if(now-lastRing>=state.alarm.repeat*1000){
      lastRing=now;
      var k=due.some(function(o){return o.r.sound==='alarm'})?'alarm':due.some(function(o){return o.r.sound==='beep'})?'beep':'chime';
      if(!DESKTOP)play(k);
    }
    document.title='(!) Take '+due.map(function(o){return o.r.name}).join(', ');
  }else{
    if(alarmKey||document.querySelector('#alarm-host .overlay.alarm:not(.closing)')){
      alarmKey='';
      if(ALARM_ONLY){
        document.getElementById('alarm-host').innerHTML='<div class="overlay"><div class="dialog panel al-done"><div class="al-pip">'+pipEl('party')+'</div><h2>All done!</h2><div class="al-sub">Nice work. This window closes by itself.</div><button class="btn" id="al-close">Close</button></div></div>';
        lastPt={x:innerWidth/2,y:innerHeight/2,t:Date.now()};burst('gem',30);
        document.getElementById('al-close').onclick=function(){window.close()};
        setTimeout(function(){if(!dueList().length)window.close()},3200);
      }else{
        var ov=document.querySelector('#alarm-host .overlay');
        if(ov&&!reducedMotion()){ov.classList.add('closing');setTimeout(function(){if(!alarmKey)document.getElementById('alarm-host').innerHTML=''},330)}
        else document.getElementById('alarm-host').innerHTML='';
      }
    }
    lastRing=0;document.title='Pixel Life';
  }
}
function renderAlarm(due){
  var rows=due.map(function(o){
    var r=o.r,k=esc(o.key);
    return '<div class="alrow"><div>'+icon(r.icon||'star')+'<div><div class="al-time">'+fmtTime(o.t)+'</div><b>'+esc(r.name)+'</b>'+(r.note?'<div class="muted">'+esc(r.note)+'</div>':'')+'</div></div>'+
      '<div class="actions"><button class="btn primary" data-dose="taken" data-key="'+k+'">Done</button>'+

  }).join('');

    '<div class="al-top"><div class="al-pip">'+pipEl('alert')+'</div><div><h2 id="al-h">'+(due.length>1?'It\'s time for these!':'It\'s time!')+'</h2><div class="al-sub">'+clock(Date.now())+(due.length>1?' · '+due.length+' reminders at once':'')+'</div></div></div>'+rows+

  if(box){box.innerHTML=inner;box.classList.add('settled')}

function startParticles(){
  var cv=document.getElementById('wl-cv');if(!cv||reducedMotion())return;
  var ctx=cv.getContext('2d'),ps=[],cols=['#4aedd9','#a8fdf0','#80d42a','#f5c542','#259a8c'];
  function size(){cv.width=innerWidth;cv.height=innerHeight}

      p.y-=p.v;p.w+=.02;if(p.y<-10){p.y=cv.height+10;p.x=Math.random()*cv.width}

    var db=r[0],u=r[1];
    if(!db||!u)return goLocal();
    return Promise.resolve(u.id()).then(function(id){
      if(!id)return goLocal();
      docRef=db.doc('data/users/'+id+'/vault');mode='db';renderStatus();subscribe();
    });
  }).catch(goLocal);
})();
})();
</script>
